<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Vadim Inshakov</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg: #fafafa;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --accent: #555;
            --border: #e5e5e5;
            --code-bg: #f0f0f0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 60px 20px;
            line-height: 1.75;
            font-size: 17px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-weight: 500;
            color: var(--text);
            margin-top: 2em;
            margin-bottom: 0.6em;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        h1 {
            font-size: 26px;
            margin-top: 0;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        h2 {
            font-size: 18px;
        }

        h3 {
            font-size: 16px;
        }

        h4 {
            font-size: 15px;
        }

        a {
            color: var(--accent);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        a:hover {
            color: var(--text);
        }

        p {
            margin: 0 0 1.2em;
        }

        code {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background-color: var(--code-bg);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.88em;
            color: var(--text);
        }

        pre {
            background-color: #282c34;
            padding: 20px 22px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1.6em 0;
            line-height: 1.6;
        }

        pre code {
            background-color: transparent;
            padding: 0;
            color: #abb2bf;
            font-size: 0.85em;
            border-radius: 0;
        }

        blockquote {
            border-left: 3px solid var(--border);
            margin: 1.6em 0;
            padding: 8px 20px;
            color: var(--text-muted);
        }

        blockquote p {
            margin: 0.5em 0;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 32px auto;
            display: block;
        }

        ul, ol {
            padding-left: 1.4em;
        }

        li {
            margin-bottom: 0.3em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.6em 0;
            font-size: 0.9em;
        }

        th, td {
            padding: 10px 14px;
            border: 1px solid var(--border);
            text-align: left;
        }

        th {
            background-color: var(--code-bg);
            font-weight: 600;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2.5em 0;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 48px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: -0.01em;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--text);
        }

        .article-meta {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: -12px;
            margin-bottom: 40px;
        }

        .loading {
            text-align: center;
            margin-top: 80px;
            color: var(--text-muted);
        }

        .error {
            color: var(--accent);
            text-align: center;
            margin-top: 60px;
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 6px;
        }

        @media (max-width: 600px) {
            body {
                padding: 40px 20px;
                font-size: 16px;
            }

            .container {
                padding-bottom: 60px;
            }

            h1 {
                font-size: 22px;
            }

            h2 {
                font-size: 17px;
            }

            pre {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="archive.html" class="back-link">← Archive</a>
        <div id="content">
            <div class="loading">Loading article…</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const post = params.get('post');

        if (post) {
            let fetchUrl = `articles/${post}.md`;
            if (window.location.protocol === 'file:') {
                fetchUrl = `https://raw.githubusercontent.com/vadiminshakov/vadiminshakov.github.io/main/articles/${post}.md`;
            }

            fetch(fetchUrl)
                .then(response => {
                    if (!response.ok) throw new Error(`Failed to load article (${response.status})`);
                    return response.text();
                })
                .then(text => {
                    const frontmatterMatch = text.match(/^---[\s\S]*?---\n/);
                    const fm = frontmatterMatch ? frontmatterMatch[0] : '';
                    const content = text.replace(/^---[\s\S]*?---\n/, '');

                    marked.setOptions({
                        highlight: function (code, lang) {
                            const language = highlight.getLanguage(lang) ? lang : 'plaintext';
                            return highlight.highlight(code, { language }).value;
                        },
                        langPrefix: 'hljs language-'
                    });

                    document.getElementById('content').innerHTML = marked.parse(content);

                    const titleMatch = fm.match(/title:\s*"(.*?)"/);
                    const authorMatch = fm.match(/author:\s*"(.*?)"/);
                    const dateMatch = fm.match(/date:\s*"(.*?)"/);

                    if (titleMatch) {
                        document.title = titleMatch[1] + " - Vadim Inshakov";
                        const h1 = document.createElement('h1');
                        h1.textContent = titleMatch[1];
                        document.getElementById('content').prepend(h1);
                    }

                    if (authorMatch || dateMatch) {
                        const meta = document.createElement('div');
                        meta.className = 'article-meta';
                        const parts = [];
                        if (authorMatch) parts.push(authorMatch[1]);
                        if (dateMatch) parts.push(dateMatch[1]);
                        meta.textContent = parts.join(' · ');
                        if (parts.length) {
                            const h1El = document.querySelector('#content h1');
                            if (h1El) h1El.after(meta);
                        }
                    }

                    hljs.highlightAll();
                })
                .catch(err => {
                    console.error(err);
                    let msg = err.message;
                    document.getElementById('content').innerHTML = `<div class="error">
                        <h3>Error loading article</h3>
                        <p>${msg}</p>
                    </div>`;
                });
        } else {
            document.getElementById('content').innerHTML = "<p>No article specified.</p>";
        }
    </script>
</body>

</html>
